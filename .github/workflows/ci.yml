name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: 驗證詞庫
        run: node dist/cli.js validate

      - name: CLI 冒煙測試
        run: |
          node dist/cli.js --help
          node dist/cli.js --version
          node dist/cli.js
          node dist/cli.js ui --help
          node dist/cli.js status
        env:
          ANTIGRAVITY_I18N_HOME: ${{ runner.temp }}/agi18n
