# 贊助按鈕設定（GitHub 頁面右上角的「Sponsor」按鈕）
# Funding / Sponsor button configuration
#
# Docs: https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/displaying-a-sponsor-button-in-your-repository

# GitHub Sponsors：需要先在 https://github.com/sponsors 開通，可填多個帳號
# github: [<github-username>]

# Ko-fi：https://ko-fi.com/<username> 中的 <username>
# ko_fi: <kofi-username>

# Buy Me a Coffee：https://buymeacoffee.com/<username> 中的 <username>
# buy_me_a_coffee: <buymeacoffee-username>

# 自訂贊助頁面（最多 4 個，必須是完整網址）
custom: ["https://github.com/Carinoasd/antigravity-i18n/blob/main/SPONSOR.md"]
